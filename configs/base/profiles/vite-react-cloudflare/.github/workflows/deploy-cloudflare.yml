# Lints, typechecks, builds, and deploys to Cloudflare on every push to main.
# Pull requests run lint, typecheck, and build only.
#
# Conventions this workflow relies on, set in the project's wrangler.jsonc:
#   - the D1 binding is named DB (migrations accept a binding or database name)
#   - the Worker sources live in worker/ with their own tsconfig.json
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A deploy is never cancelled mid-run: stopping between the migration and the
# Worker upload would leave the schema ahead of the deployed code.
concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Generate Worker types
        run: npx wrangler types
      - name: Typecheck Worker
        run: npx tsc -p worker/tsconfig.json
      - name: Build
        run: npm run build
      # The two steps below are the only ones that see the Cloudflare
      # credentials. workflow_dispatch from any other branch is refused by the
      # ref check.
      - name: Apply D1 migrations
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy Worker
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
